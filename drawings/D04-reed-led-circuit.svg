<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
<title>D04 干簧输入与LED单路原理图</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">
<text x="30" y="32" font-size="24" fill="#193239" text-anchor="start">D04 / 每格复制一份 · 输入与指示灯</text>
<text x="50" y="108" font-size="22" fill="#C55343" text-anchor="start">3V3</text>
<line x1="90" y1="125" x2="90" y2="185" stroke="#C55343" stroke-width="2"/>
<line x1="90" y1="185" x2="195" y2="185" stroke="#C55343" stroke-width="2"/>
<circle cx="195" cy="185" r="3" fill="#193239" stroke="#193239" stroke-width="2"/>
<circle cx="250" cy="185" r="3" fill="#193239" stroke="#193239" stroke-width="2"/>
<line x1="195" y1="185" x2="242" y2="155" stroke="#193239" stroke-width="2"/>
<text x="185" y="137" font-size="19" fill="#193239" text-anchor="start">NO 干簧触点</text>
<line x1="250" y1="185" x2="385" y2="185" stroke="#326DA8" stroke-width="2"/>
<circle cx="385" cy="185" r="4" fill="#326DA8" stroke="#326DA8" stroke-width="2"/>
<line x1="385" y1="185" x2="485" y2="185" stroke="#326DA8" stroke-width="2"/>
<rect x="485" y="176" width="75" height="18" rx="0" fill="white" stroke="#193239" stroke-width="2"/>
<text x="522.5" y="167" font-size="17" fill="#193239" text-anchor="middle">1kΩ</text>
<line x1="560" y1="185" x2="760" y2="185" stroke="#326DA8" stroke-width="2"/>
<text x="780" y="192" font-size="22" fill="#326DA8" text-anchor="start">GPIO 输入</text>
<line x1="385" y1="185" x2="385" y2="255" stroke="#193239" stroke-width="2"/>
<rect x="376" y="255" width="18" height="70" rx="0" fill="white" stroke="#193239" stroke-width="2"/>
<text x="415" y="295" font-size="19" fill="#193239" text-anchor="start">10kΩ 外部下拉</text>
<line x1="385" y1="325" x2="385" y2="357" stroke="#193239" stroke-width="2"/>
<line x1="375.0" y1="357" x2="395.0" y2="357" stroke="#193239" stroke-width="2"/>
<line x1="379.0" y1="363" x2="391.0" y2="363" stroke="#193239" stroke-width="2"/>
<line x1="383.0" y1="369" x2="387.0" y2="369" stroke="#193239" stroke-width="2"/>
<text x="50" y="420" font-size="23" fill="#137C78" text-anchor="start">磁铁近 → 触点闭合 → HIGH；移开 → LOW</text>
<text x="50" y="455" font-size="20" fill="#193239" text-anchor="start">本版与固件 REED_CLOSED_LEVEL=HIGH 一致</text>
<text x="50" y="525" font-size="20" fill="#137C78" text-anchor="start">GPIO 灯输出</text>
<line x1="200" y1="520" x2="295" y2="520" stroke="#137C78" stroke-width="2"/>
<rect x="295" y="511" width="85" height="18" rx="0" fill="white" stroke="#193239" stroke-width="2"/>
<text x="337.5" y="502" font-size="17" fill="#193239" text-anchor="middle">330Ω</text>
<line x1="380" y1="520" x2="500" y2="520" stroke="#137C78" stroke-width="2"/>
<polygon points="500,505 500,535 525,520" fill="white" stroke="#193239"/>
<line x1="525" y1="505" x2="525" y2="535" stroke="#193239" stroke-width="2"/>
<line x1="525" y1="520" x2="700" y2="520" stroke="#193239" stroke-width="2"/>
<line x1="690.0" y1="520" x2="710.0" y2="520" stroke="#193239" stroke-width="2"/>
<line x1="694.0" y1="526" x2="706.0" y2="526" stroke="#193239" stroke-width="2"/>
<line x1="698.0" y1="532" x2="702.0" y2="532" stroke="#193239" stroke-width="2"/>
<line x1="520" y1="494" x2="545" y2="474" stroke="#137C78" stroke-width="2"/>
<polygon points="545,474 541.1173078241203,482.11940277775176 536.2263331538296,476.00568443988834" fill="#137C78" stroke="#137C78"/>
<line x1="535" y1="504" x2="560" y2="484" stroke="#137C78" stroke-width="2"/>
<polygon points="560,484 556.1173078241203,492.11940277775176 551.2263331538296,486.00568443988834" fill="#137C78" stroke="#137C78"/>
<text x="490" y="566" font-size="19" fill="#193239" text-anchor="start">LED 阳极在左，阴极在右</text>
<text x="50" y="623" font-size="20" fill="#C55343" text-anchor="start">不要省略输入下拉；不要直接把LED跨接GPIO与GND</text>
</g></svg>