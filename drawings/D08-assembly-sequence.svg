<text x="65" y="210" font-size="25" fill="#193239" text-anchor="start">试印配合</text>
<text x="65" y="250" font-size="18" fill="#607780" text-anchor="start">孔径试片 / 单格架</text>
<line x1="325" y1="195" x2="358" y2="195" stroke="#137C78" stroke-width="2"/>
<polygon points="358,195 349.8959760788259,198.91468980700108 349.8959760788259,191.08531019299892" fill="#137C78" stroke="#137C78"/>
<rect x="365" y="100" width="280" height="190" rx="14" fill="#EDF3F2" stroke="#607780" stroke-width="2"/>
<circle cx="407" cy="142" r="23" fill="#137C78" stroke="#137C78" stroke-width="2"/>
<text x="407" y="150" font-size="25" fill="white" text-anchor="middle">2</text>
<text x="390" y="210" font-size="25" fill="#193239" text-anchor="start">验证单格</text>
<text x="390" y="250" font-size="18" fill="#607780" text-anchor="start">磁铁 / 干簧 / 一路电路</text>
<line x1="650" y1="195" x2="683" y2="195" stroke="#137C78" stroke-width="2"/>
<polygon points="683,195 674.8959760788259,198.91468980700108 674.8959760788259,191.08531019299892" fill="#137C78" stroke="#137C78"/>
<rect x="690" y="100" width="280" height="190" rx="14" fill="#EDF3F2" stroke="#607780" stroke-width="2"/>
<circle cx="732" cy="142" r="23" fill="#137C78" stroke="#137C78" stroke-width="2"/>
<text x="732" y="150" font-size="25" fill="white" text-anchor="middle">3</text>
<text x="715" y="210" font-size="25" fill="#193239" text-anchor="start">扩展八路</text>
<text x="715" y="250" font-size="18" fill="#607780" text-anchor="start">焊接 / 线标 / 逐路测试</text>
<rect x="40" y="345" width="280" height="190" rx="14" fill="#EDF3F2" stroke="#607780" stroke-width="2"/>
<circle cx="82" cy="387" r="23" fill="#137C78" stroke="#137C78" stroke-width="2"/>
<text x="82" y="395" font-size="25" fill="white" text-anchor="middle">4</text>
<text x="65" y="455" font-size="25" fill="#193239" text-anchor="start">底座安装</text>
<text x="65" y="495" font-size="18" fill="#607780" text-anchor="start">载板 / 绝缘 / 固定电源线</text>
<line x1="325" y1="440" x2="358" y2="440" stroke="#137C78" stroke-width="2"/>
<polygon points="358,440 349.8959760788259,443.9146898070011 349.8959760788259,436.0853101929989" fill="#137C78" stroke="#137C78"/>
<rect x="365" y="345" width="280" height="190" rx="14" fill="#EDF3F2" stroke="#607780" stroke-width="2"/>
<circle cx="407" cy="387" r="23" fill="#137C78" stroke="#137C78" stroke-width="2"/>
<text x="407" y="395" font-size="25" fill="white" text-anchor="middle">5</text>
<text x="390" y="455" font-size="25" fill="#193239" text-anchor="start">上盖安装</text>
<text x="390" y="495" font-size="18" fill="#607780" text-anchor="start">传感器 / LED / 屏幕 / 药杯</text>
<line x1="650" y1="440" x2="683" y2="440" stroke="#137C78" stroke-width="2"/>
<polygon points="683,440 674.8959760788259,443.9146898070011 674.8959760788259,436.0853101929989" fill="#137C78" stroke="#137C78"/>
<rect x="690" y="345" width="280" height="190" rx="14" fill="#EDF3F2" stroke="#607780" stroke-width="2"/>
<circle cx="732" cy="387" r="23" fill="#137C78" stroke="#137C78" stroke-width="2"/>
<text x="732" y="395" font-size="25" fill="white" text-anchor="middle">6</text>
<text x="715" y="455" font-size="25" fill="#193239" text-anchor="start">联调验收</text>
<text x="715" y="495" font-size="18" fill="#607780" text-anchor="start">诊断固件 → 联网固件</text>
<text x="40" y="605" font-size="21" fill="#137C78" text-anchor="start">每一步通过再进入下一步；磁铁封胶与整机打印放在单格验证之后。</text>
</g></svg>