<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
<title>D08 装配顺序</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">
<text x="30" y="32" font-size="24" fill="#193239" text-anchor="start">D08 / 装配顺序与阶段验收</text>
<rect x="40" y="100" width="280" height="190" rx="14" fill="#EDF3F2" stroke="#607780" stroke-width="2"/>
