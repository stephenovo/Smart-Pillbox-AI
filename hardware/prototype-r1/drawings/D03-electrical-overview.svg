<polygon points="360,262 351.8959760788259,265.9146898070011 351.8959760788259,258.0853101929989" fill="#326DA8" stroke="#326DA8"/>
<line x1="360" y1="432" x2="305" y2="432" stroke="#137C78" stroke-width="2"/>
<polygon points="305,432 313.1040239211741,428.0853101929989 313.1040239211741,435.9146898070011" fill="#137C78" stroke="#137C78"/>
<rect x="700" y="180" width="275" height="93" rx="8" fill="white" stroke="#607780" stroke-width="2"/>
