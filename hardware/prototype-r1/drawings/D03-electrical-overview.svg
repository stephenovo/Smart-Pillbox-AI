<text x="837" y="349" font-size="19" fill="#193239" text-anchor="middle">红LED：GPIO39</text>
<text x="837" y="380" font-size="17" fill="#607780" text-anchor="middle">串联330Ω</text>
<line x1="645" y1="356" x2="700" y2="356" stroke="#137C78" stroke-width="2"/>
<polygon points="700,356 691.8959760788259,359.9146898070011 691.8959760788259,352.0853101929989" fill="#137C78" stroke="#137C78"/>
<rect x="700" y="444" width="275" height="93" rx="8" fill="white" stroke="#607780" stroke-width="2"/>
<text x="837" y="481" font-size="19" fill="#193239" text-anchor="middle">压电驱动：GPIO40</text>
<text x="837" y="512" font-size="17" fill="#607780" text-anchor="middle">2N3904 + 外部方波</text>
<line x1="645" y1="488" x2="700" y2="488" stroke="#137C78" stroke-width="2"/>
<polygon points="700,488 691.8959760788259,491.9146898070011 691.8959760788259,484.0853101929989" fill="#137C78" stroke="#137C78"/>
