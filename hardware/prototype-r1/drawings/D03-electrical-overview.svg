<text x="165" y="283" font-size="18" fill="#607780" text-anchor="middle">3V3 / 10k下拉 / 1k串联</text>
<rect x="25" y="385" width="280" height="115" rx="8" fill="white" stroke="#607780" stroke-width="2"/>
<text x="165" y="425" font-size="22" fill="#193239" text-anchor="middle">8 路绿色LED</text>
<text x="165" y="463" font-size="18" fill="#607780" text-anchor="middle">每灯330Ω串联</text>
