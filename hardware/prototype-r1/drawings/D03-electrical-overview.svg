<text x="502" y="323" font-size="20" fill="#326DA8" text-anchor="middle">15,16,17,18</text>
<text x="502" y="377" font-size="20" fill="#137C78" text-anchor="middle">GPIO灯：8,9,10,11</text>
<text x="502" y="412" font-size="20" fill="#137C78" text-anchor="middle">12,13,14,21</text>
<line x1="70" y1="564" x2="930" y2="564" stroke="#607780" stroke-width="3"/>
<text x="502" y="600" font-size="21" fill="#193239" text-anchor="middle">所有支路共地；外接信号均为3.3V逻辑</text>
<text x="502" y="636" font-size="19" fill="#C55343" text-anchor="middle">只从USB单路供电；不同时接另一组5V；本版没有锂电池</text>
</g></svg>