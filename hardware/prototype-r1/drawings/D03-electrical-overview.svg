<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670">
<title>D03 电气系统总览</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">
<text x="30" y="32" font-size="24" fill="#193239" text-anchor="start">D03 / 电气系统 · ESP32-S3 + 洞洞板</text>
<rect x="360" y="190" width="285" height="285" rx="12" fill="#EDF3F2" stroke="#137C78" stroke-width="2"/>
<text x="502" y="232" font-size="24" fill="#193239" text-anchor="middle">ESP32-S3 开发板</text>
<rect x="380" y="78" width="245" height="60" rx="8" fill="#F7F4E9" stroke="#607780" stroke-width="2"/>
<text x="502" y="115" font-size="21" fill="#193239" text-anchor="middle">USB 5V → 板载稳压</text>
<line x1="502" y1="138" x2="502" y2="190" stroke="#137C78" stroke-width="2"/>
<polygon points="502,190 498.0853101929989,181.8959760788259 505.9146898070011,181.8959760788259" fill="#137C78" stroke="#137C78"/>
